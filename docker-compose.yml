version: "3.8"

services:
  # 1. Service Database PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: talkhive-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: circleapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Service Backend Express
  backend:
    build: ./Backend
    container_name: talkhive-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/circleapp"
      JWT_SECRET: "kunci_rahasiaku_123"
    depends_on:
      - db

  # 3. Service Frontend React Vite
  frontend:
    build: ./Frontend
    container_name: talkhive-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
